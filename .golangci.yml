version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - thelper
    - tparallel
    - varnamelen
    - wsl_v5
  settings:
    varnamelen:
      # Short names that are idiomatic in DSP / Go code
      ignore-names:
        - sr # sample rate
        - e # engine local variable
        - i # loop index
        - t # track / time
        - v # voice / value
        - ok # Go error-check idiom
  exclusions:
    rules:
      # Tests favour readable inline literals and t.Fatalf blocks.
      - path: _test\.go
        linters:
          - varnamelen
          - wsl_v5

formatters:
  enable:
    - gofmt
