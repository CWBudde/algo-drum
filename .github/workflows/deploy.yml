name: Deploy to GitHub Pages

# Gated on CI. Both workflows used to trigger on `push: main` independently, so
# a deploy could publish a commit whose unit or e2e tests were red. `needs:`
# cannot express a cross-workflow dependency, and there is no "wait for checks"
# trigger, so `workflow_run` is the mechanism GitHub actually provides for
# "run B after A finished successfully". Chosen over the alternative (turning
# ci.yml into a reusable `workflow_call` workflow and calling it from here)
# because that would either run every CI job twice on a push to main or force
# main pushes to lose their own CI status checks, and it would hand the CI jobs
# this workflow's `pages: write` / `id-token: write` permissions.
#
# Consequences to be aware of:
#   * workflow_run only fires for the version of this file on the default
#     branch, so this gating starts working once merged to main.
#   * workflow_run carries no `paths` filter, so the previous `paths-ignore`
#     (README/PLAN/docs) is gone: a docs-only push to main now redeploys the
#     same site. Harmless, and worth it for the gate.
#   * GITHUB_REF/GITHUB_SHA point at the default branch, not the triggering
#     commit, hence the explicit `ref:` on checkout below.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Never cancel an in-flight deployment (GitHub's guidance for deploy
  # workflows): a cancelled run can leave Pages mid-publish. Queued runs wait
  # instead, and the last one wins.
  cancel-in-progress: false

jobs:
  build:
    # Only deploy successful CI runs for pushes to main. PR-triggered CI runs
    # (including fork PRs, whose head_branch could even be "main") are excluded
    # by the event check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Build exactly the commit CI validated. Empty on workflow_dispatch,
          # which makes checkout fall back to the dispatched ref.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build WASM
        run: bash scripts/build-wasm.sh

      - name: Report WASM size
        run: |
          size=$(stat -c%s web/public/algo_drum.wasm)
          size_kib=$(( (size + 1023) / 1024 ))
          {
            echo "### WASM build size"
            echo
            echo "\`algo_drum.wasm\`: ${size} bytes (~${size_kib} KiB), built with \`-ldflags=\"-s -w\"\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: `latest` makes the published bundle non-reproducible and
          # lets an upstream bun release break deploys with no repo change.
          bun-version: "1.3.7"

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install frontend dependencies
        run: cd web && bun install --frozen-lockfile

      - name: Build frontend
        env:
          # Derive the Pages base path from the repo name so forks/renames
          # don't need a source change; vite.config.ts defaults to
          # "/algo-drum/" when this is unset (local prod builds unaffected).
          VITE_BASE: /${{ github.event.repository.name }}/
        run: cd web && bun run build

      - name: Stamp service worker cache version
        env:
          # The commit actually built (see `ref:` on checkout). Not GITHUB_SHA:
          # under workflow_run that points at the default branch's HEAD, which
          # need not be the commit CI validated, so the cache name could label
          # content it doesn't describe.
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          sed -i "s/algo-drum-v1/algo-drum-${BUILD_SHA::12}/" web/dist/sw.js
          # The stamp is a silent no-op if sw.js's literal is ever renamed, so
          # verify it landed rather than shipping an unversioned cache (P7).
          grep -q "algo-drum-${BUILD_SHA::12}" web/dist/sw.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
