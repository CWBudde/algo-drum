name: CI Go

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Test
        run: go test ./...

      - name: Test with the engine self-check enabled
        # -tags drumassert compiles Engine.Validate into Render
        # (internal/drum/assert_debug.go), so the same suite fails on corrupt
        # engine state — a wrong step length, a playhead outside the loop — at
        # the render that produced it, instead of only on the audio it happens
        # to make. The shipped build compiles the check away.
        run: go test -tags drumassert ./...

      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build ./...

      - name: Check go.mod is tidy
        run: |
          GOOS=js GOARCH=wasm go mod tidy
          git diff --exit-code go.mod go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Check the generated voice parameter table is current
        # web/src/engine/voiceParams.generated.ts mirrors internal/drum/params.go
        # and is committed so the UI can read defaults synchronously at mount.
        # Changing a spec without running `just gen-params` must fail here
        # rather than silently drift from the sound the engine produces.
        run: |
          go run ./cmd/gen-voiceparams -o web/src/engine/voiceParams.generated.ts
          bunx prettier@3.9.5 --write web/src/engine/voiceParams.generated.ts
          git diff --exit-code web/src/engine/voiceParams.generated.ts

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        env:
          # cmd/wasm/main.go is `//go:build js && wasm`, so on the runner's
          # native GOOS it is invisible to the linter ("no go files to
          # analyze") — including the only `unsafe` usage in the repo. Lint the
          # WASM target, matching `just lint`.
          GOOS: js
          GOARCH: wasm
        with:
          # Pinned for reproducibility: an upstream release must not be able to
          # break CI with no repo change. Must stay a v2.x — .golangci.yml is
          # schema `version: "2"` and golangci-lint-action@v9 requires v2.
          version: v2.12.2

  purego:
    name: Go (purego)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      # This job is a convention guard, not a numerical one, and the distinction
      # is worth being honest about because it used to be both.
      #
      # It existed to test `internal/physical/midpoint_noasm.go`, the portable
      # twin of an AVX2 kernel: `!amd64 || purego` is false on the runner, so the
      # Go job above compiled the assembly tier and never the portable one, even
      # though the shipped js/wasm voice always takes the portable file. That
      # code now lives in github.com/cwbudde/algo-tom, which gates both halves in
      # its own CI, and no architecture-gated file remains in this repository.
      #
      # So there is nothing left here for the tag to *select*, and the test half
      # was dropped rather than kept as reassurance it can no longer provide —
      # under `purego` this repo compiles an identical program, and a green run
      # would state nothing. What remains is the build, because `purego` is a
      # repo-wide convention: anything added here that gates on it, or any
      # dependency that does, must keep compiling under it from the day it lands.
      - name: Build under the purego tag
        run: go build -tags purego ./...
