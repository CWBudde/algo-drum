name: CI Go

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Test
        run: go test ./...

      - name: Test with the engine self-check enabled
        # -tags drumassert compiles Engine.Validate into Render
        # (internal/drum/assert_debug.go), so the same suite fails on corrupt
        # engine state — a wrong step length, a playhead outside the loop — at
        # the render that produced it, instead of only on the audio it happens
        # to make. The shipped build compiles the check away.
        run: go test -tags drumassert ./...

      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build ./...

      - name: Check go.mod is tidy
        run: |
          GOOS=js GOARCH=wasm go mod tidy
          git diff --exit-code go.mod go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Check the generated voice parameter table is current
        # web/src/engine/voiceParams.generated.ts mirrors internal/drum/params.go
        # and is committed so the UI can read defaults synchronously at mount.
        # Changing a spec without running `just gen-params` must fail here
        # rather than silently drift from the sound the engine produces.
        run: |
          go run ./cmd/gen-voiceparams -o web/src/engine/voiceParams.generated.ts
          bunx prettier@3.9.5 --write web/src/engine/voiceParams.generated.ts
          git diff --exit-code web/src/engine/voiceParams.generated.ts

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        env:
          # cmd/wasm/main.go is `//go:build js && wasm`, so on the runner's
          # native GOOS it is invisible to the linter ("no go files to
          # analyze") — including the only `unsafe` usage in the repo. Lint the
          # WASM target, matching `just lint`.
          GOOS: js
          GOARCH: wasm
        with:
          # Pinned for reproducibility: an upstream release must not be able to
          # break CI with no repo change. Must stay a v2.x — .golangci.yml is
          # schema `version: "2"` and golangci-lint-action@v9 requires v2.
          version: v2.12.2

  purego:
    name: Go (purego)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      # The Go job above compiles the amd64 assembly tier and never the
      # portable one: `internal/physical/midpoint_noasm.go` is
      # `!amd64 || purego`, both false on the runner. The shipped voice is
      # js/wasm and always takes that file, so without this job the code the
      # browser runs is build-checked (`GOOS=js GOARCH=wasm go build ./...`) and
      # numerically untested — a new `_amd64.s` could land beside a broken
      # portable twin and CI would stay green.
      #
      # `purego` on the runner is the closest *testable* stand-in: same source
      # file, same Go semantics, and a real architecture to run the digests on.
      # A js/wasm test job would be the real thing and is not possible today —
      # Go's own FMA-accelerated exp_amd64.s makes math.Exp differ by one ULP
      # between the two targets, so the committed render digests do not
      # reproduce there. See AGENTS.md, "The portable path is what ships".
      - name: Build the portable path
        # ./... and not just internal/physical: the tag is a repo-wide
        # convention, so a future `!purego` file anywhere must compile under it
        # from the day it lands. tools/paper-figures is a separate module and is
        # not reached here; `just lint` covers it.
        run: go build -tags purego ./...

      - name: Test the portable path
        # Only internal/physical/...: that is the only tree where the tag
        # selects different code, so a full `./...` run would recompile an
        # identical program and spend the time twice.
        run: go test -tags purego ./internal/physical/...
