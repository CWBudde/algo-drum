name: CI E2E

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E
    # Playwright smoke test against the production build. Needs Go to compile
    # the WASM engine, then a real Chromium (installed here, not the dev
    # container's pre-provisioned one).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build WASM
        run: bash scripts/build-wasm.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          # Playwright's default browser location on Linux. Keyed on the
          # lockfile so a @playwright/test bump re-downloads Chromium.
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install Chromium
        working-directory: web
        # Kept unconditional: on a cache hit this only verifies the browser and
        # (re)installs the OS-level deps, which are not part of the cache.
        run: bunx playwright install --with-deps chromium

      - name: E2E smoke test
        working-directory: web
        run: bun run test:e2e

      - name: Upload Playwright artifacts
        # playwright.config.ts sets trace: "on-first-retry" with retries in CI,
        # so a failing run produces traces/screenshots — keep them instead of
        # discarding them with the runner.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore
