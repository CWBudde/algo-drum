name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs: rapid pushes to a PR (or to main) should not keep a
# stale full matrix alive. Safe here because CI publishes nothing — the deploy
# workflow uses cancel-in-progress: false for exactly the opposite reason.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Keep this file as the trigger and status-check entry point. Each gate lives in
# a callable workflow so its setup and ownership remain focused, following the
# same structure as algo-fft's test.yaml orchestrator.
jobs:
  go:
    uses: ./.github/workflows/ci-go.yml

  format:
    uses: ./.github/workflows/ci-format.yml

  web:
    uses: ./.github/workflows/ci-web.yml

  e2e:
    uses: ./.github/workflows/ci-e2e.yml
