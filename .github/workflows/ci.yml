name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs: rapid pushes to a PR (or to main) should not keep a
# stale full matrix alive. Safe here because CI publishes nothing — the deploy
# workflow uses cancel-in-progress: false for exactly the opposite reason.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Test
        run: go test ./...

      - name: Test with the engine self-check enabled
        # -tags drumassert compiles Engine.Validate into Render
        # (internal/drum/assert_debug.go), so the same suite fails on corrupt
        # engine state — a wrong step length, a playhead outside the loop — at
        # the render that produced it, instead of only on the audio it happens
        # to make. The shipped build compiles the check away.
        run: go test -tags drumassert ./...

      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build ./...

      - name: Check go.mod is tidy
        run: |
          GOOS=js GOARCH=wasm go mod tidy
          git diff --exit-code go.mod go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Check the generated voice parameter table is current
        # web/src/engine/voiceParams.generated.ts mirrors internal/drum/params.go
        # and is committed so the UI can read defaults synchronously at mount.
        # Changing a spec without running `just gen-params` must fail here
        # rather than silently drift from the sound the engine produces.
        run: |
          go run ./cmd/gen-voiceparams -o web/src/engine/voiceParams.generated.ts
          bunx prettier@3.9.5 --write web/src/engine/voiceParams.generated.ts
          git diff --exit-code web/src/engine/voiceParams.generated.ts

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        env:
          # cmd/wasm/main.go is `//go:build js && wasm`, so on the runner's
          # native GOOS it is invisible to the linter ("no go files to
          # analyze") — including the only `unsafe` usage in the repo. Lint the
          # WASM target, matching `just lint`.
          GOOS: js
          GOARCH: wasm
        with:
          # Pinned for reproducibility: an upstream release must not be able to
          # break CI with no repo change. Must stay a v2.x — .golangci.yml is
          # schema `version: "2"` and golangci-lint-action@v8 requires v2.
          version: v2.12.2

  format:
    # Mirrors `just check-formatted`: treefmt with every formatter it lists
    # (treefmt.toml) actually installed, so the check can't silently no-op
    # via --allow-missing-formatter.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Install Go-based formatters
        run: |
          go install mvdan.cc/gofumpt@v0.10.0
          go install github.com/daixiang0/gci@v0.14.0
          go install mvdan.cc/sh/v3/cmd/shfmt@v3.13.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Install prettier
        run: |
          bun install --global prettier@3.9.5
          echo "$(bun pm bin -g)" >> "$GITHUB_PATH"

      - name: Install treefmt
        env:
          TREEFMT_VERSION: 2.5.0
        run: |
          asset="treefmt_${TREEFMT_VERSION}_linux_amd64.tar.gz"
          base_url="https://github.com/numtide/treefmt/releases/download/v${TREEFMT_VERSION}"
          curl -sSL -o "$asset" "$base_url/$asset"
          curl -sSL -o checksums.txt "$base_url/treefmt_${TREEFMT_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c checksums.txt
          tar -xzf "$asset" treefmt
          sudo install -m 755 treefmt /usr/local/bin/treefmt
          rm -f "$asset" checksums.txt treefmt

      - name: Check formatting
        # No --allow-missing-formatter (unlike the justfile recipe, where local
        # dev may legitimately lack a formatter): if an install step above
        # degrades — e.g. prettier, which owns every .ts/.tsx/.md/.yml/.json/
        # .css file — this must fail loudly instead of passing green having
        # formatted nothing.
        run: treefmt --fail-on-change

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bunx vite build

  e2e:
    # Playwright smoke test against the production build. Needs Go to compile
    # the WASM engine, then a real Chromium (installed here, not the dev
    # container's pre-provisioned one).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build WASM
        run: bash scripts/build-wasm.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.7"

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          # Playwright's default browser location on Linux. Keyed on the
          # lockfile so a @playwright/test bump re-downloads Chromium.
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install Chromium
        working-directory: web
        # Kept unconditional: on a cache hit this only verifies the browser and
        # (re)installs the OS-level deps, which are not part of the cache.
        run: bunx playwright install --with-deps chromium

      - name: E2E smoke test
        working-directory: web
        run: bun run test:e2e

      - name: Upload Playwright artifacts
        # playwright.config.ts sets trace: "on-first-retry" with retries in CI,
        # so a failing run produces traces/screenshots — keep them instead of
        # discarding them with the runner.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore
